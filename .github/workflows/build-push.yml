name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Run tests first - builds only proceed if tests pass
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: winningcv_test
          POSTGRES_PASSWORD: winningcv_test
          POSTGRES_DB: winningcv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winningcv_test -d winningcv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: |
          pytest tests/test_utils.py tests/test_settings.py tests/test_postgres_schema.py tests/test_postgres_persistence.py tests/test_job_result_workspace.py tests/test_job_processor.py tests/test_api_integration.py tests/test_task_queue.py -v --tb=short
        env:
          AIRTABLE_PAT: "fake_for_testing"
          AIRTABLE_BASE_ID: "fake_base"
          AIRTABLE_TABLE_ID: "fake_table"
          AIRTABLE_TABLE_ID_HISTORY: "fake_history"
          AIRTABLE_TABLE_ID_USER_CONFIGS: "fake_configs"
          AIRTABLE_TABLE_ID_CV_VERSIONS: "fake_versions"
          AZURE_AI_ENDPOINT: "https://fake.openai.azure.com"
          AZURE_AI_API_KEY: "fake_key"
          AZURE_DEPLOYMENT: "fake_deployment"
          TEST_POSTGRES_DSN: "postgresql://winningcv_test:winningcv_test@localhost:5432/winningcv_test"

      - name: Validate deployment checks
        run: |
          {
            echo UID=1000
            echo GID=1000
            echo JOB_USER_EMAIL=ci@example.com
          } > .env
          ./scripts/validate_prod_config.sh
          bash -n scripts/prod_smoke_check.sh
          bash -n scripts/prod_monitor.sh
          bash -n scripts/prod_monitor_cron.sh
          bash -n scripts/install_prod_monitor_cron.sh
          bash -n scripts/validate_prod_config.sh
          bash -n scripts/prod_migrate_db.sh

  build-backend:
    needs: [test]  # Only build if tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: [test]  # Only build if tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_AUTH_SERVICE_URL=${{ secrets.VITE_AUTH_SERVICE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_MICROSOFT_CLIENT_ID=${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
            VITE_GITHUB_CLIENT_ID=${{ secrets.VITE_GITHUB_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

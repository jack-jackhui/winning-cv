name: Deploy to Production

on:
  workflow_run:
    workflows: [Build and Push Docker Images]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
      - name: Sync deployment files to Tailscale server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TAILSCALE_DNS_NAME }}
          username: ${{ secrets.TAILSCALE_SSH_USER || 'root' }}
          key: ${{ secrets.TAILSCALE_SSH_KEY }}
          source: "docker-compose.yml,scripts/deploy.sh,scripts/prod_smoke_check.sh,scripts/prod_monitor.sh,scripts/prod_monitor_cron.sh,scripts/install_prod_monitor_cron.sh,scripts/validate_prod_config.sh,scripts/prod_migrate_db.sh,init-db/02-data-storage-schema.sql,init-db/03-migration-v2.sql,init-db/06-jobs-user-link-uniqueness.sql,init-db/07-jobs-next-action.sql"
          target: "~/winning-cv"
          overwrite: true
      - name: Deploy to Tailscale server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TAILSCALE_DNS_NAME }}
          username: ${{ secrets.TAILSCALE_SSH_USER || 'root' }}
          key: ${{ secrets.TAILSCALE_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/winning-cv
            ./scripts/validate_prod_config.sh
            docker compose pull
            ./scripts/prod_migrate_db.sh
            docker compose up -d --remove-orphans
            for i in $(seq 1 60); do
              frontend_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' winning-cv-frontend 2>/dev/null || echo missing)"
              api_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' winning-cv-api 2>/dev/null || echo missing)"
              if curl -fsS http://localhost:13001/health >/dev/null && curl -fsS http://localhost:13001/api/health >/dev/null && [ "$frontend_health" = "healthy" ] && [ "$api_health" = "healthy" ]; then
                echo "Deployment health checks passed after ${i}s"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "Deployment health checks did not pass: frontend=$frontend_health api=$api_health" >&2
                docker compose ps
                docker compose logs --tail=80 frontend api
                exit 1
              fi
              sleep 2
            done
            ./scripts/prod_smoke_check.sh
            docker image prune -af --filter "until=168h"
            echo "Deployment successful at $(date)"

  notify-success:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Send Telegram notification (Success)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ✅ <b>WinningCV Deployment Successful</b>

            📦 Commit: <code>${{ github.event.workflow_run.head_sha }}</code>
            👤 Author: ${{ github.actor }}
            🔗 <a href="${{ github.event.workflow_run.html_url }}">View Build Run</a>

  notify-failure:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Send Telegram notification (Failure)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ❌ <b>WinningCV Deployment Failed</b>

            📦 Commit: <code>${{ github.event.workflow_run.head_sha }}</code>
            👤 Author: ${{ github.actor }}
            🔗 <a href="${{ github.event.workflow_run.html_url }}">View Build Run</a>
